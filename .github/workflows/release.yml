name: Release Build

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.6.0
  workflow_dispatch: # Allows manual trigger from GitHub UI (for testing)
    inputs:
      create_release:
        description: 'Create GitHub Release (yes/no)'
        required: false
        default: 'no'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact-name: EZ-Game-Audio-Windows

          - os: ubuntu-latest
            platform: linux
            artifact-name: EZ-Game-Audio-Linux

          - os: macos-latest
            platform: macos
            artifact-name: EZ-Game-Audio-macOS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          EZ_AUDIO_SKIP_FFMPEG_DOWNLOAD: '1'

      # Mirrors + retries live in the composite action; see its action.yml.
      - name: Download ffmpeg
        uses: ./.github/actions/setup-ffmpeg-bin
        with:
          platform: ${{ matrix.platform }}

      - name: Run unit tests
        run: npm test

      # Build the application
      - name: Build release package
        run: npm run package

      - name: Run smoke test on packaged binary
        run: npm run test:smoke

      # Rename archives with platform name
      - name: Rename archives (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (Test-Path "release/EZ-Game-Audio-Conversion.zip") {
            Rename-Item "release/EZ-Game-Audio-Conversion.zip" "${{ matrix.artifact-name }}.zip"
          }
          if (Test-Path "release/EZ-Game-Audio-Conversion.zip.sha256") {
            Rename-Item "release/EZ-Game-Audio-Conversion.zip.sha256" "${{ matrix.artifact-name }}.zip.sha256"
          }
          if (Test-Path "release/EZ-Game-Audio-Conversion.7z") {
            Rename-Item "release/EZ-Game-Audio-Conversion.7z" "${{ matrix.artifact-name }}.7z"
          }
          if (Test-Path "release/EZ-Game-Audio-Conversion.7z.sha256") {
            Rename-Item "release/EZ-Game-Audio-Conversion.7z.sha256" "${{ matrix.artifact-name }}.7z.sha256"
          }

      - name: Rename archives (Unix)
        if: matrix.platform != 'windows'
        run: |
          if [ -f "release/EZ-Game-Audio-Conversion.zip" ]; then
            mv "release/EZ-Game-Audio-Conversion.zip" "release/${{ matrix.artifact-name }}.zip"
          fi
          if [ -f "release/EZ-Game-Audio-Conversion.zip.sha256" ]; then
            mv "release/EZ-Game-Audio-Conversion.zip.sha256" "release/${{ matrix.artifact-name }}.zip.sha256"
          fi

      # Upload artifacts
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            release/*.zip
            release/*.7z
            release/*.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'yes'
    # The default GITHUB_TOKEN is read-only; creating a release needs contents: write.
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.7z
            artifacts/**/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
