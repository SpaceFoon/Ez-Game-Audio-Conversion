name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  lint-build-unit:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Download ffmpeg binaries
        run: npm run install:ffmpeg

      # Check only: `npm run fix` rewrites files, so bad formatting never failed CI.
      - name: Lint and format
        run: npx eslint . && npx prettier --check .

      - name: Type check and build
        run: npm run build

      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage

      - name: Run property and fuzz tests
        run: npm run test:property && npm run test:fuzz

      - name: Report coverage gaps
        if: always()
        run: npm run coverage:gaps

      - name: Run unit tests with open-handle detection
        run: npm run test:ci -- --testPathIgnorePatterns=/integration/ --testPathIgnorePatterns=real_files.test.ts --testPathIgnorePatterns=workerProtocol.integration.test.ts

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
          if-no-files-found: ignore

  e2e-real-ffmpeg:
    name: E2E (${{ matrix.platform }})
    # Windows leg runs on the local self-hosted Windows runner. Fork PRs fall back
    # to ubuntu-latest so untrusted code never reaches self-hosted hardware.
    # macOS stays on GitHub-hosted runners.
    runs-on: ${{ matrix.os == 'windows-latest' && (github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","Windows"]')) || matrix.os != 'ubuntu-latest' && matrix.os || github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows

          - os: ubuntu-latest
            platform: linux

          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci
        env:
          EZ_AUDIO_SKIP_FFMPEG_DOWNLOAD: "1"

      # Mirrors + retries live in the composite action; see its action.yml.
      - name: Download ffmpeg
        uses: ./.github/actions/setup-ffmpeg-bin
        with:
          platform: ${{ matrix.platform }}

      - name: Build TypeScript
        run: npm run build

      - name: Run E2E tests (real ffmpeg + workers)
        run: npm run test:e2e
        env:
          E2E_REQUIRED: "1"
